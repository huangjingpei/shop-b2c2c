# 文件：nginx-gmall.conf
# 用途：Nginx站点、静态资源与API反向代理配置模板。
# 维护注意：可能包含部署替换占位符；核对域名、证书、前端base、后端端口及探针。模板不能直接当作当前环境有效配置，修改后需在目标环境验证。 阿里云目录仍含GMall/PDK等历史工程路径，使用前必须对照当前项目核对，详见D34/D35。
# ============================================================================
# GMall Nginx 站点配置（正式版：HTTPS 模式）
# 占位符：
#   __GMALL_ROOT__    -> /opt/gmall
#   __SERVER_NAME__   -> mall.graddu.com
#   __BACKEND_PORT__  -> 8080
#   __SSL_CERT__      -> /etc/letsencrypt/live/mall.graddu.com/fullchain.pem
#   __SSL_KEY__       -> /etc/letsencrypt/live/mall.graddu.com/privkey.pem
# ============================================================================

# ---------------- 全局安全：防爬虫 UA 拦截与限流区定义 ----------------
map $http_user_agent $is_malicious_bot {
    default 0;
    ~*(Scrapy|HttpClient|requests|python|Go-http-client|curl|wget|ApacheBench|PostmanRuntime) 1;
    ~*(headless|PhantomJS|Bytespider|YisouSpider) 1;
}

# 针对管理员登录接口限制单个 IP 访问频次 (每分钟 5 次)，从网关层打断撞库与暴力破解
limit_req_zone $binary_remote_addr zone=gmall_admin_login_limit:10m rate=5r/m;

# ---------------- HTTP：证书验证 + 全站跳转 HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # certbot 续期用的 HTTP-01 路径，必须放在跳转规则之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/gmall-access.log;
    error_log  /var/log/nginx/gmall-error.log warn;
    server_tokens off;
}

# ---------------- HTTPS：正式站点 ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:GMALLSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/gmall-access.log;
    error_log  /var/log/nginx/gmall-error.log warn;
    server_tokens off;

    # 客户端上传文件大小限制（默认 1m 会导致上传大图报 413 Request Entity Too Large）
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;

    # 本地静态图片与媒体文件托管 (/uploads/ 与 /m/uploads/)
    location ^~ /uploads/ {
        alias __GMALL_ROOT__/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /m/uploads/ {
        alias __GMALL_ROOT__/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # C 端移动商城静态资源 (/m)
    location /m {
        root __GMALL_ROOT__/www/mobile;
        index index.html;
        try_files $uri $uri/ /m/index.html;
    }

    # 推广邀请专属链接：重定向至移动端注册页并携带邀请码与注册模式
    location /invite {
        return 302 /m/#/pages/login/index?mode=register&$args;
    }

    # 管理员登录接口防暴力破解高频限流 (单 IP 每分钟最多 5 次，突发 5 次，超频直接返回 429)
    location = /api/admin/auth/login {
        limit_req zone=gmall_admin_login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # API 接口反向代理
    location /api/ {
        # 1. 第一道防线：网关层直接秒级阻断恶意爬虫与自动化脚本 (0 消耗穿透至后端)
        if ($is_malicious_bot) {
            return 403 '{"code":403,"message":"Access Denied: Automated crawler or bot blocked by gateway.","data":null}';
        }

        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 拦截全网自动化扫描器对常见后台入口的探测猜测，直接返回 404
    location ~* ^/(admin|login|manage|system|wp-admin|phpmyadmin)$ {
        return 404;
    }

    # B 端运营管理后台 (私密挂载入口，防止被全网探测)
    location = __ADMIN_PORTAL_PATH__ {
        return 301 $scheme://$http_host__ADMIN_PORTAL_PATH__/;
    }

    location ^~ __ADMIN_PORTAL_PATH__/ {
        alias __GMALL_ROOT__/www/admin/;
        index index.html;
        try_files $uri $uri/ __ADMIN_PORTAL_PATH__/index.html;
    }

    # 移动商城作为对外主站展示 (根路径访问无论是移动端还是 PC，均直接访问 C 端商城)
    location = / {
        return 302 /m/;
    }

    # 兜底：其他未匹配的根级请求导向移动商城
    location / {
        return 302 /m/;
    }
}

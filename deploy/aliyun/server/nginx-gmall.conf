# 文件：nginx-gmall.conf
# 用途：Nginx站点、静态资源与API反向代理配置模板。
# 维护注意：与deploy/nginx/nginx.prod.conf保持同一路径约定：商城base=/，管理端base=/console/，/healthz为存活、/readyz为有界就绪；旧/m、/invite、/actuator入口明确404，修改后需在目标环境验证。
# ============================================================================
# GMall Nginx 站点配置（正式版：HTTPS 模式）
# 占位符：
#   __GMALL_ROOT__    -> /opt/gmall
#   __SERVER_NAME__   -> mall.graddu.com
#   __BACKEND_PORT__  -> 8080
#   __SSL_CERT__      -> /etc/letsencrypt/live/mall.graddu.com/fullchain.pem
#   __SSL_KEY__       -> /etc/letsencrypt/live/mall.graddu.com/privkey.pem
# ============================================================================

# ---------------- 全局安全：防爬虫 UA 拦截与限流区定义 ----------------
map $http_user_agent $is_malicious_bot {
    default 0;
    ~*(Scrapy|HttpClient|requests|python|Go-http-client|curl|wget|ApacheBench|PostmanRuntime) 1;
    ~*(headless|PhantomJS|Bytespider|YisouSpider) 1;
}

# 针对管理员登录接口限制单个 IP 访问频次 (每分钟 5 次)，从网关层打断撞库与暴力破解
limit_req_zone $binary_remote_addr zone=gmall_admin_login_limit:10m rate=5r/m;

# ---------------- HTTP：证书验证 + 全站跳转 HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # certbot 续期用的 HTTP-01 路径，必须放在跳转规则之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/gmall-access.log;
    error_log  /var/log/nginx/gmall-error.log warn;
    server_tokens off;
}

# ---------------- HTTPS：正式站点 ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:GMALLSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/gmall-access.log;
    error_log  /var/log/nginx/gmall-error.log warn;
    server_tokens off;

    # 客户端上传文件大小限制（默认 1m 会导致上传大图报 413 Request Entity Too Large）
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;

    # 本地静态图片与媒体文件托管 (/uploads/)
    location ^~ /uploads/ {
        alias __GMALL_ROOT__/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 真实应用存活接口；应用不可达时保持502，不返回静态healthy。
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/api/v1/auth/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # 就绪检查失败必须保留HTTP 503；仍不代表支付渠道或完整业务验收。
    location = /readyz {
        access_log off;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/api/v1/auth/ready;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
    }

    # 管理员登录接口防暴力破解高频限流 (单 IP 每分钟最多 5 次，突发 5 次，超频直接返回 429)
    # R06：真实登录路径为 /api/v1/auth/login（旧管理登录路径不存在）。
    location = /api/v1/auth/login {
        # 限流键使用真实客户端地址；下面 X-Forwarded-For 仅用于链路追踪，覆盖而非追加，防外部伪造。
        limit_req zone=gmall_admin_login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # API 接口反向代理
    location /api/ {
        # 1. 第一道防线：网关层直接秒级阻断恶意爬虫与自动化脚本 (0 消耗穿透至后端)
        if ($is_malicious_bot) {
            return 403 '{"code":403,"message":"Access Denied: Automated crawler or bot blocked by gateway.","data":null}';
        }

        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 拦截全网自动化扫描器对常见后台入口的探测猜测，直接返回 404
    location ~* ^/(admin|login|manage|system|wp-admin|phpmyadmin)$ {
        return 404;
    }

    # B 端运营管理后台 (私密挂载入口，防止被全网探测)
    location = __ADMIN_PORTAL_PATH__ {
        return 301 $scheme://$http_host__ADMIN_PORTAL_PATH__/;
    }

    location ^~ __ADMIN_PORTAL_PATH__/ {
        alias __GMALL_ROOT__/www/admin/;
        index index.html;
        try_files $uri $uri/ __ADMIN_PORTAL_PATH__/index.html;
    }

    # C 端商城与代付收银台 (根路径挂载)；缺失静态资源必须404，不能回退HTML导致MIME错误
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    # 不存在注册页、Actuator或旧移动端工程，明确拒绝旧入口，避免假健康/空白SPA
    location = /invite { return 404; }
    location ^~ /invite/ { return 404; }
    location = /actuator/health { return 404; }
    location = /m { return 404; }
    location ^~ /m/ { return 404; }

    # 所有设备访问同一个商城；History路由刷新回退至真实商城入口
    location / {
        root __GMALL_ROOT__/www/storefront;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

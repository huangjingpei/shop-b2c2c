# 文件：nginx-gmall-bootstrap.conf
# 用途：Nginx站点、静态资源与API反向代理配置的HTTP引导版本。
# 维护注意：可能包含部署替换占位符；核对域名、证书、前端base、后端端口及探针。模板不能直接当作当前环境有效配置，修改后需在目标环境验证。 阿里云目录仍含GMall/PDK等历史工程路径，使用前必须对照当前项目核对，详见D34/D35。
# ============================================================================
# GMall Nginx 站点配置（引导版：HTTP 模式，用于 Let's Encrypt 证书申请）
# 占位符：__GMALL_ROOT__  __SERVER_NAME__  __BACKEND_PORT__
# 严格遵守三条铁律：
# 1. 绝不使用 default_server
# 2. 绝不影响既有站点 (live-chat, pdk.graddu.com)
# ============================================================================

map $http_user_agent $is_malicious_bot {
    default 0;
    ~*(Scrapy|HttpClient|requests|python|Go-http-client|curl|wget|ApacheBench|PostmanRuntime) 1;
    ~*(headless|PhantomJS|Bytespider|YisouSpider) 1;
}

# R06/T36：引导站点同样限制管理员登录单 IP 频次；真实路径 /api/v1/auth/login。
limit_req_zone $binary_remote_addr zone=gmall_admin_login_limit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    access_log /var/log/nginx/gmall-access.log;
    error_log  /var/log/nginx/gmall-error.log warn;
    server_tokens off;

    # 客户端上传文件大小限制
    client_max_body_size 50m;

    # certbot HTTP-01 验证路径，必须放在最前面
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;

    # 本地静态图片与媒体文件托管 (/uploads/ 与 /m/uploads/)
    location ^~ /uploads/ {
        alias __GMALL_ROOT__/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /m/uploads/ {
        alias __GMALL_ROOT__/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # C 端移动商城静态资源 (支持在 /m/ 访问)
    location /m {
        root __GMALL_ROOT__/www/mobile;
        index index.html;
        try_files $uri $uri/ /m/index.html;
    }

    # 推广邀请专属链接：重定向至移动端注册页并携带邀请码与注册模式
    location /invite {
        return 302 /m/#/pages/login/index?mode=register&$args;
    }

    # 管理员登录接口限流；限流键为直连客户端地址，X-Forwarded-For 覆盖而非追加。
    location = /api/v1/auth/login {
        limit_req zone=gmall_admin_login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # API 接口反向代理至 Spring Boot 8080
    location /api/ {
        # 1. 第一道防线：网关层直接秒级阻断恶意爬虫与自动化脚本 (0 消耗穿透至后端)
        if ($is_malicious_bot) {
            return 403 '{"code":403,"message":"Access Denied: Automated crawler or bot blocked by gateway.","data":null}';
        }

        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 拦截全网自动化扫描器对常见后台入口的探测猜测，直接返回 404
    location ~* ^/(admin|login|manage|system|wp-admin|phpmyadmin)$ {
        return 404;
    }

    # B 端运营管理后台 (私密挂载入口，防止被全网探测)
    location = __ADMIN_PORTAL_PATH__ {
        return 301 $scheme://$http_host__ADMIN_PORTAL_PATH__/;
    }

    location ^~ __ADMIN_PORTAL_PATH__/ {
        alias __GMALL_ROOT__/www/admin/;
        index index.html;
        try_files $uri $uri/ __ADMIN_PORTAL_PATH__/index.html;
    }

    # 移动商城作为对外主站展示 (根路径访问无论是移动端还是 PC，均直接访问 C 端商城)
    location = / {
        return 302 /m/;
    }

    # 兜底：其他未匹配的根级请求导向移动商城
    location / {
        return 302 /m/;
    }
}

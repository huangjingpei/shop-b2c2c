# ==============================================================================
# GMall 企业级生产 Nginx 网关配置 (高可用、安全加固与动静分离)
# ==============================================================================

# ---------------- 生产级防爬虫：第一道防线 (UA黑名单与恶意脚本拦截) ----------------
map $http_user_agent $is_malicious_bot {
    default 0;
    ~*(Scrapy|HttpClient|requests|python|Go-http-client|curl|wget|ApacheBench|PostmanRuntime) 1;
    ~*(headless|PhantomJS|Bytespider|YisouSpider) 1;
}

# 限流区域定义：以客户端真实IP为键，限制单IP每秒最多20个请求，突发burst=40
limit_req_zone $binary_remote_addr zone=gmall_api_limit:10m rate=20r/s;
limit_req_status 429;

upstream gmall_backend_cluster {
    server backend:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 客户端上传限制 (支持商品图、资质证书等大文件上传)
    client_max_body_size 50m;
    server_tokens off;

    # ---------------- 安全响应头加固 ----------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------- 生产级 Gzip 压缩 ----------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------- 负载均衡探针 ----------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ---------------- 静态资源长效缓存 ----------------
    location ^~ /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /m/uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ---------------- C 端移动商城 (Uni-app H5) ----------------
    location /m {
        alias /usr/share/nginx/html/mobile;
        index index.html;
        try_files $uri $uri/ /m/index.html;
    }

    # ---------------- 推广裂变专属短链重定向 ----------------
    location /invite {
        return 302 /m/#/pages/login/index?mode=register&$args;
    }

    # ---------------- B 端管理后台 (Vue3 Element-Plus) ----------------
    location /admin {
        alias /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------------- 后端接口反向代理与限流防护 ----------------
    location /api/ {
        # 1. 第一道防线：网关层直接秒级阻断恶意爬虫与自动化脚本 (0 消耗穿透至后端)
        if ($is_malicious_bot) {
            return 403 '{"code":403,"message":"Access Denied: Automated crawler or bot blocked by gateway.","data":null}';
        }

        # 速率限制防护：防接口恶意刷单、高频CC攻击
        limit_req zone=gmall_api_limit burst=40 nodelay;

        proxy_pass http://gmall_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ---------------- Actuator 健康检查端点直通 ----------------
    location /actuator/health {
        access_log off;
        proxy_pass http://gmall_backend_cluster/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---------------- 根路径默认重定向 ----------------
    location = / {
        # 手机端访问自动跳转至移动商城，PC端访问跳转至管理后台
        if ($http_user_agent ~* '(Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini)') {
            return 302 /m/;
        }
        return 302 /admin/;
    }
}

# 文件：nginx.prod.conf
# 用途：当前B2B2C单机部署的通用HTTP网关，包含在Nginx的http上下文。
# 维护注意：商城base=/，管理端base=/console/；产物根目录及后端端口须按环境核对。
# 本文件不是完整nginx.conf，不配置证书、不执行部署；/healthz为存活，/readyz为有界依赖就绪检查。
# 云部署脚本不会自动采用本文件，适配前见docs/部署入口与路径约定.md；API权限仍由后端验证。

limit_req_zone $binary_remote_addr zone=shop_api_limit:10m rate=20r/s;
limit_req_status 429;

upstream shop_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root "/opt/shop-b2b2c/www/storefront";
    index index.html;
    client_max_body_size 10m;
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 真实应用存活接口；应用不可达时保持502，不返回静态healthy。
    location = /healthz {
        access_log off;
        proxy_pass http://shop_backend/api/v1/auth/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # 就绪检查失败必须保留HTTP 503；仍不代表支付渠道或完整业务验收。
    location = /readyz {
        access_log off;
        proxy_pass http://shop_backend/api/v1/auth/ready;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
    }

    location /api/ {
        client_max_body_size 2m;
        limit_req zone=shop_api_limit burst=40 nodelay;
        # 不附加尾斜杠，保留完整/api/v1/...路径。
        proxy_pass http://shop_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # T36：覆盖而非追加，防外部伪造 X-Forwarded-For 绕过限流。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }

    location = /console { return 308 /console/; }
    # 静态资源缺失必须404，不能回退HTML导致浏览器脚本MIME错误。
    location ^~ /console/assets/ {
        alias "/opt/shop-b2b2c/www/admin/assets/";
        expires 30d;
    }
    location ^~ /console/ {
        alias "/opt/shop-b2b2c/www/admin/";
        try_files $uri $uri/ /console/index.html;
        expires -1;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
    }
    location ^~ /uploads/ {
        alias "/opt/shop-b2b2c/uploads/";
        expires 30d;
    }

    # 不存在注册页、Actuator或旧移动端工程，明确拒绝旧入口，避免假健康/空白SPA。
    location = /invite { return 404; }
    location ^~ /invite/ { return 404; }
    location = /actuator/health { return 404; }
    location = /m { return 404; }
    location ^~ /m/ { return 404; }
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }

    # 所有设备访问同一个商城；History路由刷新回退至真实商城入口。
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}

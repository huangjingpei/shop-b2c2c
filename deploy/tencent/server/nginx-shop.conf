# ============================================================================
# Shop-B2B2C Nginx 站点配置（正式版：HTTPS 模式）
# 占位符：
#   __SHOP_ROOT__          -> /opt/shop-b2b2c
#   __SERVER_NAME__        -> 1688.graddu.com
#   __BACKEND_PORT__       -> 8080
#   __ADMIN_PORTAL_PATH__  -> /console
#   __SSL_CERT__           -> /etc/letsencrypt/live/1688.graddu.com/fullchain.pem
#   __SSL_KEY__            -> /etc/letsencrypt/live/1688.graddu.com/privkey.pem
# ============================================================================

# ---------------- 全局安全：防爬虫 UA 拦截 ----------------
map $http_user_agent $is_malicious_bot {
    default 0;
    ~*(Scrapy|HttpClient|requests|python|Go-http-client|curl|wget|ApacheBench|PostmanRuntime) 1;
    ~*(headless|PhantomJS|Bytespider|YisouSpider) 1;
}

# 针对管理员登录接口限制单个 IP 访问频次 (每分钟 10 次)，从网关层打断撞库与暴力破解
limit_req_zone $binary_remote_addr zone=shop_admin_login_limit:10m rate=10r/m;

# ---------------- HTTP：证书验证 + 全站强制跳转 HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # certbot 续期用的 HTTP-01 路径，必须放在跳转规则之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 强制跳转 HTTPS，并锁定标准域名
    location / {
        return 301 https://__SERVER_NAME__$request_uri;
    }

    access_log /var/log/nginx/shop-b2b2c-access.log;
    error_log  /var/log/nginx/shop-b2b2c-error.log warn;
    server_tokens off;
}

# ---------------- HTTPS：正式站点 ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    # 解决浏览器/网络代理偶发向 443 端口发起明文 HTTP 导致 400 Bad Request 的问题
    error_page 497 https://$host$request_uri;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SHOPSLL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS 安全头 (全站强推 HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/shop-b2b2c-access.log;
    error_log  /var/log/nginx/shop-b2b2c-error.log warn;
    server_tokens off;

    # 客户端上传文件大小限制
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;

    # 本地静态图片与媒体文件托管 (/uploads/)
    location ^~ /uploads/ {
        alias __SHOP_ROOT__/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 管理员登录接口防暴力破解限流
    location = /api/v1/auth/login {
        limit_req zone=shop_admin_login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # API 接口反向代理
    location /api/ {
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 兼容 /admin 访问，自动重定向至私密控制台 __ADMIN_PORTAL_PATH__/
    location = /admin {
        return 301 $scheme://$http_host__ADMIN_PORTAL_PATH__/;
    }
    location ^~ /admin/ {
        return 301 $scheme://$http_host__ADMIN_PORTAL_PATH__/;
    }

    # B 端运营管理后台私密挂载入口 (防止全网字典扫描)
    location = __ADMIN_PORTAL_PATH__ {
        return 301 $scheme://$http_host__ADMIN_PORTAL_PATH__/;
    }

    location ^~ __ADMIN_PORTAL_PATH__/ {
        alias __SHOP_ROOT__/www/admin/;
        index index.html;
        try_files $uri $uri/ __ADMIN_PORTAL_PATH__/index.html;
    }

    # C 端商城与代付收银台 (根路径挂载)
    location / {
        root __SHOP_ROOT__/www/storefront;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

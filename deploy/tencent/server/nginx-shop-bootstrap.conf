# 文件：nginx-shop-bootstrap.conf
# 用途：Nginx站点、静态资源与API反向代理配置的HTTP引导版本。
# 维护注意：与正式模板同一路径约定（商城=/、管理端=/console/、/healthz与/readyz、/admin与/invite及/actuator返回404）；仅用于HTTP引导，修改后需在目标环境验证。
# ============================================================================
# Shop-B2B2C Nginx 站点配置（引导版：HTTP 模式，用于 Let's Encrypt 证书申请）
# 占位符：__SHOP_ROOT__  __SERVER_NAME__  __BACKEND_PORT__  __ADMIN_PORTAL_PATH__
# 严格遵守铁律：
# 1. 绝不使用 default_server
# 2. 绝不影响既有站点与端口
# ============================================================================

# R06/T36：引导站点同样限制管理员登录单 IP 频次；真实路径 /api/v1/auth/login。
limit_req_zone $binary_remote_addr zone=shop_admin_login_limit:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    access_log /var/log/nginx/shop-b2b2c-access.log;
    error_log  /var/log/nginx/shop-b2b2c-error.log warn;
    server_tokens off;

    # 客户端上传文件大小限制
    client_max_body_size 50m;

    # certbot HTTP-01 验证路径，必须放在最前面
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;

    # 本地静态图片与媒体文件托管
    location ^~ /uploads/ {
        alias __SHOP_ROOT__/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 管理员登录接口限流；限流键为直连客户端地址，X-Forwarded-For 覆盖而非追加。
    location = /api/v1/auth/login {
        limit_req zone=shop_admin_login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # API 接口反向代理至 Spring Boot 后端
    location /api/ {
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 真实应用存活接口；应用不可达时保持502。
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/api/v1/auth/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # 有界就绪接口；依赖异常必须保留HTTP 503。
    location = /readyz {
        access_log off;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/api/v1/auth/ready;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
    }

    # 不存在旧移动端、注册页与Actuator入口。
    location = /invite { return 404; }
    location ^~ /invite/ { return 404; }
    location = /actuator/health { return 404; }
    location = /m { return 404; }
    location ^~ /m/ { return 404; }

    # B 端运营管理后台私密挂载入口
    location = __ADMIN_PORTAL_PATH__ {
        return 301 $scheme://$http_host__ADMIN_PORTAL_PATH__/;
    }

    location ^~ __ADMIN_PORTAL_PATH__/ {
        alias __SHOP_ROOT__/www/admin/;
        index index.html;
        try_files $uri $uri/ __ADMIN_PORTAL_PATH__/index.html;
    }

    # C 端商城与代付收银台 (根路径访问)；缺失静态资源必须404。
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location / {
        root __SHOP_ROOT__/www/storefront;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

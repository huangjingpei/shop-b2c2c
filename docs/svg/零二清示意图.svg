    <path d="M5.62842 18.3563C7.08963 17.0398 9.39997 16 12 16C14.6 16 16.9104 17.0398 18.3716 18.3563" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
  </g>
  <text x="70" y="84" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">买家</text>
</g>
<g class="actor" data-id="存管专户" data-label="微信电商收付通专户 (央行备付金)" data-type="participant">
  <rect x="253.26049999999998" y="30" width="251.063" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="378.792" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">微信电商收付通专户 (央行备付金)</text>
</g>
<g class="actor" data-id="平台" data-label="平台商户号 (抽佣 3%)" data-type="participant">
  <rect x="641.488" y="30" width="165.84799999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="724.412" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">平台商户号 (抽佣 3%)</text>
</g>
<g class="actor" data-id="卖家" data-label="卖家个人储蓄卡 (货款 97%)" data-type="actor">
  <g transform="translate(930.7850000000001,32) scale(1.5)">
    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />

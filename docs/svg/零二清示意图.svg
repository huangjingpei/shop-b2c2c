<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080.2340000000002 277.45" width="1080.2340000000002" height="277.45" style="--bg:#FFFFFF;--fg:#1E293B;--line:#64748B;--muted:#475569;--surface:#F8FAFC;--border:#CBD5E1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="买家" x1="70" y1="92.45" x2="70" y2="247.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="存管专户" x1="378.792" y1="70" x2="378.792" y2="247.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="平台" x1="724.412" y1="70" x2="724.412" y2="247.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="卖家" x1="948.7850000000001" y1="92.45" x2="948.7850000000001" y2="247.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="买家" data-to="存管专户" data-label="支付 100 元 (资金直达央行备付金，平台资金零接触)" data-line-style="solid" data-arrow-head="filled" data-self="false" data-step="1">
  <line x1="70" y1="112.45" x2="378.792" y2="112.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <rect x="75.39599999999999" y="94.3" width="298" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="224.396" y="102.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">支付 100 元 (资金直达央行备付金，平台资金零接触)</text>
  <circle class="sequence-number" cx="70" cy="112.45" r="9" fill="var(--_arrow)" stroke="var(--bg)" stroke-width="1" />
  <text x="70" y="112.45" class="sequence-number-label" font-size="10" text-anchor="middle" font-weight="600" fill="var(--bg)" dy="3.5">1</text>
</g>
<g class="message" data-from="存管专户" data-to="平台" data-label="微信自动划入 3 元 (平台确认为信息服务费，只对 3 元交税)" data-line-style="solid" data-arrow-head="filled" data-self="false" data-step="2">
  <line x1="378.792" y1="167.45" x2="724.412" y2="167.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <rect x="382.602" y="149.29999999999998" width="338" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="551.602" y="157.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">微信自动划入 3 元 (平台确认为信息服务费，只对 3 元交税)</text>
  <circle class="sequence-number" cx="378.792" cy="167.45" r="9" fill="var(--_arrow)" stroke="var(--bg)" stroke-width="1" />
  <text x="378.792" y="167.45" class="sequence-number-label" font-size="10" text-anchor="middle" font-weight="600" fill="var(--bg)" dy="3.5">2</text>
</g>
<g class="message" data-from="存管专户" data-to="卖家" data-label="微信自动划入 97 元 (货款直达卖家卡，零二清)" data-line-style="solid" data-arrow-head="filled" data-self="false" data-step="3">
  <line x1="378.792" y1="207.45" x2="948.7850000000001" y2="207.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <rect x="529.2885" y="189.29999999999998" width="269" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="663.7885" y="197.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">微信自动划入 97 元 (货款直达卖家卡，零二清)</text>
  <circle class="sequence-number" cx="378.792" cy="207.45" r="9" fill="var(--_arrow)" stroke="var(--bg)" stroke-width="1" />
  <text x="378.792" y="207.45" class="sequence-number-label" font-size="10" text-anchor="middle" font-weight="600" fill="var(--bg)" dy="3.5">3</text>
</g>
<g class="note" data-position="over" data-actors="平台,存管专户">
  <polygon points="419.977,120.45 677.227,120.45 683.227,126.45 683.227,143.45 419.977,143.45" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="677.227,120.45 683.227,126.45 677.227,126.45" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="551.602" y="131.95" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">交易完成，平台给微信发送一条【分账指令】</text>
</g>
<g class="actor" data-id="买家" data-label="买家" data-type="actor">
  <g transform="translate(52,32) scale(1.5)">

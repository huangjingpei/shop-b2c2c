server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: shop-b2b2c-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shop_b2b2c?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:89dfu*#$ewr87l}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: ShopB2b2cCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # 开发期数据库一键启动自动自愈与初始化配置 (单一权威源: classpath:db/schema.sql)
  sql:
    init:
      mode: always # 每次应用启动自动执行 schema.sql 初始化建表与种子数据
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
      continue-on-error: true # 容错模式：遇表或记录已存在不抛异常阻断启动

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      database: ${REDIS_DB:0}
      timeout: 5000ms

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.shop.b2b2c.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Sa-Token 权限与多端会话配置
sa-token:
  token-name: Authorization # 拦截 Authorization Header
  timeout: 2592000 # 30天 (秒)
  active-timeout: -1 # 临时有效期，-1代表不限制
  is-concurrent: true # 是否允许同一账号多端并存
  is-share: true # 登录后共用同一 Token
  token-style: uuid # 采用 uuid 风格
  is-read-header: true # 从 Header 读取
  is-read-cookie: false # 不从 Cookie 强绑定
  token-prefix: Bearer # Bearer 前缀兼容标准前端 Axios

# 平台分账与支付沙箱模拟配置
payment:
  mock: true # 第一阶段开启模拟分账桩 (零门槛全链路跑通)
  default-commission-rate: 3.00

# 平台前台访问地址 (代付短链与二维码海报基准地址)
app:
  frontend:
    storefront-url: ${APP_FRONTEND_STOREFRONT_URL:http://localhost:3002}

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

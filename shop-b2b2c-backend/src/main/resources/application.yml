# 文件：application.yml
# 用途：Spring Boot数据源、会话、SQL初始化、前台地址和认证/CORS边界配置。
# 维护注意：升级至令牌级授权快照后旧登录需重新登录；生产必须注入SPRING_DATASOURCE_USERNAME/PASSWORD且不得回退root，审查默认凭据及演示种子；开发重建以db/schema.sql为唯一结构入口，演示账号/商品仅由db/demo-seed.sql在显式开关下加载，生产profile禁用SQL初始化；关闭SQL初始化时须显式导入完整结构。payment.mock不能恢复已删除的Mock路由；新库靠schema.sql，存量库靠db/migrations/Vxxx脚本（app.schema-migration）且失败阻断启动；不得开启记录卡密/领取凭证的SQL参数日志。shop.settlement.fee-tax-rate 是服务费价税分离税率，默认0.06，不得把税额默认0；monthly-cron 只生成结算草稿，确认仍须人工。payment.reconcile.processing-threshold-minutes 是陈旧PROCESSING支付事件补偿阈值（默认5分钟），max-attempts 是渠道回查最大次数（默认5），retry-backoff-seconds 是首次指数退避秒数（默认60），超限转MANUAL_REVIEW人工队列并告警；扫描频率沿用inventory.expiry-delay-ms（默认30秒），不得另起第二套补偿调度。
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: shop-b2b2c-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shop_b2b2c?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: ShopB2b2cCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # 开发期完整基线初始化（不会升级已有表结构） (单一权威结构源: classpath:db/schema.sql)
  sql:
    init:
      mode: always # 每次应用启动自动执行结构初始化；生产由application-prod.yml改为never
      schema-locations: classpath:db/schema.sql
      # 显式演示种子开关：默认仅开发/演示加载固定账号与虚构商品；设为空值可关闭，生产profile整体不执行。
      data-locations: ${APP_DEMO_SEED_LOCATIONS:classpath:db/demo-seed.sql}
      encoding: UTF-8
      continue-on-error: false # SQL执行失败立即阻断启动，防止缺表/缺索引却报告就绪

  # 商家入驻上传：证件照片≤5MB、实人认证视频≤20MB；请求级兜底 25MB/28MB，文件落私有目录，不进公开静态目录
  servlet:
    multipart:
      max-file-size: ${SHOP_MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${SHOP_MULTIPART_MAX_REQUEST_SIZE:28MB}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      database: ${REDIS_DB:0}
      timeout: 5000ms

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.shop.b2b2c.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Sa-Token 权限与多端会话配置
sa-token:
  token-name: Authorization # 拦截 Authorization Header
  timeout: 2592000 # 30天 (秒)
  active-timeout: -1 # 临时有效期，-1代表不限制
  is-concurrent: true # 是否允许同一账号多端并存
  is-share: false # 每次登录独立Token，退出仅撤销当前端；授权快照保存在TokenSession
  token-style: uuid # 采用 uuid 风格
  is-read-header: true # 从 Header 读取
  is-read-cookie: false # 不从 Cookie 强绑定
  token-prefix: Bearer # Bearer 前缀兼容标准前端 Axios

# 平台分账与支付沙箱模拟配置
payment:
  mock: false # 公开 Mock 支付入口已移除；此配置不能开启模拟付款
  default-commission-rate: 3.00
  # G34：支付事件补偿扫描。陈旧 PROCESSING 超过阈值后按渠道流水回查；明确未支付落 FULFILLMENT_FAILED 并告警，
  # 查询异常/答复不确定保留 PROCESSING 并按指数退避重试，超过上限转 MANUAL_REVIEW 人工队列。
  reconcile:
    processing-threshold-minutes: ${PAYMENT_RECONCILE_PROCESSING_THRESHOLD_MINUTES:5}
    max-attempts: ${PAYMENT_RECONCILE_MAX_ATTEMPTS:5}
    retry-backoff-seconds: ${PAYMENT_RECONCILE_RETRY_BACKOFF_SECONDS:60}
  # T32 阶段一真实支付渠道（商家直收）：凭据只来自环境变量，缺失时对应渠道拒绝下单。
  channel:
    mock-enabled: ${PAYMENT_CHANNEL_MOCK_ENABLED:false} # 生产禁用；即使开启也不存在 MOCK 落账适配器
    notify-base-url: ${PAYMENT_NOTIFY_BASE_URL:}
    wechat:
      enabled: ${WECHAT_PAY_ENABLED:false}
      app-id: ${WECHAT_PAY_APP_ID:}
      serial-no: ${WECHAT_PAY_SERIAL_NO:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      private-key: ${WECHAT_PAY_PRIVATE_KEY:}
      platform-public-key: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY:}
      api-base: ${WECHAT_PAY_API_BASE:https://api.mch.weixin.qq.com}
    alipay:
      enabled: ${ALIPAY_ENABLED:false}
      app-id: ${ALIPAY_APP_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
      gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}

# 平台前台访问地址 (代付短链与二维码海报基准地址)
app:
  security:
    # auto派生受控前台地址的来源并保留localhost开发端口；HTTPS代理终止须允许公网来源。空值关闭跨域。
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:auto}
    # T36：仅当直连 remoteAddr 命中这些可信代理时才解析 X-Forwarded-For；默认仅本机 Nginx。支持 IPv4 CIDR。
    trusted-proxies: ${APP_SECURITY_TRUSTED_PROXIES:127.0.0.1,::1}
    login-account-limit: ${AUTH_LOGIN_ACCOUNT_LIMIT:20}
    login-ip-limit: ${AUTH_LOGIN_IP_LIMIT:100}
    login-window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:300}
    order-create-ip-limit: ${APP_ORDER_CREATE_IP_LIMIT:60}
    order-create-contact-limit: ${APP_ORDER_CREATE_CONTACT_LIMIT:30}
    order-create-window-seconds: ${APP_ORDER_CREATE_WINDOW_SECONDS:300}
    prelock-ip-limit: ${APP_PRELOCK_IP_LIMIT:60}
    prelock-token-limit: ${APP_PRELOCK_TOKEN_LIMIT:20}
    prelock-window-seconds: ${APP_PRELOCK_WINDOW_SECONDS:300}
    poster-ip-limit: ${APP_POSTER_IP_LIMIT:60}
    poster-token-limit: ${APP_POSTER_TOKEN_LIMIT:20}
    poster-window-seconds: ${APP_POSTER_WINDOW_SECONDS:60}
  frontend:
    storefront-url: ${APP_FRONTEND_STOREFRONT_URL:http://localhost:3002}
  # 生产首次管理员受控初始化：仅在库中不存在超管时创建，默认空值关闭；密码不得为演示默认口令。
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  # T12：存量库版本化迁移。新库仍由 schema.sql 建结构；脚本必须幂等，失败阻断启动，不回退忽略错误。
  schema-migration:
    enabled: ${APP_SCHEMA_MIGRATION_ENABLED:true}
    locations: classpath:db/migrations

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# T34 服务费账本与结算
shop:
  # 登录图形验证码（单实例内存存储）：开发默认不强制，生产必须把 required 设为 true；
  # 无论开关是否打开，只要前端提交了 captchaId/captchaCode 就会校验并一次性失效。
  auth:
    captcha-required: ${SHOP_AUTH_CAPTCHA_REQUIRED:false}
    captcha-ttl-seconds: ${SHOP_AUTH_CAPTCHA_TTL_SECONDS:300}
  # 商家入驻证件：私有目录由后端鉴权读取，必须纳入备份且不得暴露为静态资源；
  # 目录相对于进程工作目录，生产建议使用绝对路径并限制为应用账号可读写。
  onboarding:
    attachment-dir: ${SHOP_ONBOARDING_ATTACHMENT_DIR:./data/onboarding-attachments}
    max-attachment-bytes: ${SHOP_ONBOARDING_MAX_ATTACHMENT_BYTES:5242880}
    max-video-bytes: ${SHOP_ONBOARDING_MAX_VIDEO_BYTES:20971520}
  settlement:
    # 服务费价税分离税率；未显式配置时按0.06计算，不允许默认0税额
    fee-tax-rate: ${SETTLEMENT_FEE_TAX_RATE:0.06}
    # 月度结算草稿生成任务，仅生成DRAFT，不自动确认
    monthly-cron: ${SETTLEMENT_MONTHLY_CRON:0 20 2 1 * ?}
    # 欠费停收巡检任务，只更新收款状态，不改订单/账本金额
    arrears-cron: ${SETTLEMENT_ARREARS_CRON:0 5 3 * * ?}
    # T40 阶段二平台代收/分账总开关：默认关闭；取得支付分账资质并完成通道联调后才可开启
    platform-collect-enabled: ${PLATFORM_COLLECT_ENABLED:false}
  finance:
    # 财务双人复核：开发/试点默认关闭（允许单管理员同人操作并落 SAME_OPERATOR 标记）；
    # 生产 .env 必须设为 true，且至少配置两个财务账号，否则确认类操作会被 403 拒绝
    dual-approval-required: ${FINANCE_DUAL_APPROVAL_REQUIRED:false}

# R27/T27：幂等轻量映射保留 30 天（Q18-B），清理受最大轮次与时间预算约束
idempotency:
  retention-hours: ${IDEMPOTENCY_RETENTION_HOURS:720}
  purge-batch-size: ${IDEMPOTENCY_PURGE_BATCH_SIZE:500}
  purge-max-rounds: ${IDEMPOTENCY_PURGE_MAX_ROUNDS:20}
  purge-time-budget-ms: ${IDEMPOTENCY_PURGE_TIME_BUDGET_MS:30000}
  purge-delay-ms: ${IDEMPOTENCY_PURGE_DELAY_MS:3600000}
  purge-initial-delay-ms: ${IDEMPOTENCY_PURGE_INITIAL_DELAY_MS:600000}

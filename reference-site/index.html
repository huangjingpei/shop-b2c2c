    const AMPLITUDE_BRAND = "hostinger.com";

    let amplitudeCreationLocation;

    function setAmplitudeCreationLocation(creationLocation) {
        amplitudeCreationLocation = creationLocation;
    }

    function getAmplitudeCookieValues(keys) {
        return keys.reduce((cookieValues, key) => {
            const value = getAmplitudeCookieValue(key);

            if (value) {
                cookieValues[key] = value;
            }

            return cookieValues;
        }, {});
    }

    function getAmplitudeTrackingContext() {
        const trackingContext = {
            ...getAmplitudeCookieValues(AMPLITUDE_UTM_COOKIE_KEYS),
            ...getAmplitudeCookieValues(AMPLITUDE_AFFILIATE_COOKIE_KEYS),
        };
        const experimentCookieValue = getAmplitudeCookieValue(AMPLITUDE_EXPERIMENT_ASSIGNMENTS_COOKIE);
        const originalDocumentReferrer = getAmplitudeCookieValue(AMPLITUDE_ORIGINAL_DOCUMENT_REFERRER_COOKIE);

            trackingContext.experiment_cookie_value = experimentCookieValue;
        }

        if (originalDocumentReferrer) {
            trackingContext.original_document_referrer = originalDocumentReferrer;
        }

        return trackingContext;
    }

    function forwardAmplitudeTrackingContext() {
        const trackingContext = getAmplitudeTrackingContext();
        const cookieAttributes = '; Path=/; SameSite=Lax' + (window.location.protocol === 'https:' ? '; Secure' : '');

        if (Object.keys(trackingContext).length === 0) {

            return;

        document.cookie = AMPLITUDE_TRACKING_CONTEXT_COOKIE + '=' + encodeURIComponent(JSON.stringify(trackingContext)) + cookieAttributes;
